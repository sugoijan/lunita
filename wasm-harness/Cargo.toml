[package]
name = "lunita-wasm-harness"
version = "0.0.0"
publish = false
edition = "2024"
description = "Runs the limit cases of tests/limits.rs in wasm32-unknown-unknown, driven by run.mjs"

[lib]
crate-type = ["cdylib"]

[dependencies]
lunita = { path = ".." }

# Not part of lunita's workspace.
[workspace]
members = ["."]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
