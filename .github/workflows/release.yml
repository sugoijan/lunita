# Publishes `lunita` and `lunita-util` to crates.io and makes the GitHub release when a `v*` tag
# is pushed. The tag must be `v` followed by the version in Cargo.toml, and the changelog must
# have a `## lunita <version>` section, which becomes the release notes.
#
# crates.io authenticates the workflow by its identity (Trusted Publishing); no token is stored.
# Each crate's settings on crates.io must list this repository and `release.yml` as a trusted
# publisher, which can only be done after the crate's first (manual) publish.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check that the tag is the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lunita") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Written outside the checkout: `cargo publish` refuses a working tree with changes.
      - name: Release notes from the changelog
        run: |
          awk -v version="$VERSION" '
            /^## / { printing = ($0 ~ "^## lunita " version "( |$)") ; next }
            printing { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "CHANGELOG.md has no \"## lunita $VERSION\" section"
            exit 1
          fi

      - name: Verify the package
        run: cargo publish --dry-run -p lunita

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # `cargo publish` waits for `lunita` to reach the index before `lunita-util`.
          # A version already published (the first release, made by hand) is skipped, so a tag
          # can be pushed after it.
          for crate in lunita lunita-util; do
            if curl -sS -A "lunita release workflow (github.com/sugoijan/lunita)" \
                 "https://crates.io/api/v1/crates/$crate/$VERSION" \
               | jq -e '.version.num' > /dev/null; then
              echo "$crate $VERSION is already on crates.io"
            else
              cargo publish -p "$crate"
            fi
          done

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "lunita $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
