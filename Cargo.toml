[workspace]
resolver = "2"
members = [
    "util",
]
default-members = [
    ".",
    "util",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["すごいジャン <me@sugoijan.dev>", "kyren <catherine@kyju.org>"]
license = "MIT"
repository = "https://github.com/sugoijan/lunita"

[workspace.dependencies]
# Without `runtime-rng`, which needs `getrandom` (and JS imports on wasm32-unknown-unknown).
ahash = { version = "0.8", default-features = false, features = ["std"] }
allocator-api2 = "0.2"
anyhow = "1.0"
gc-arena = { git = "https://github.com/kyren/gc-arena", rev = "5a7534b883b703f23cfb8c3cfdf033460aa77ea9", features = ["allocator-api2", "hashbrown"] }
hashbrown = { version = "0.14", features = ["raw"] }
serde = "1.0"
thiserror = "1.0"

lunita = { path = "./", version = "0.1.0" }

[package]
name = "lunita"
description = "Stackless Lua VM in pure Rust, hardened for untrusted scripts (a fork of piccolo)"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ahash.workspace = true
allocator-api2.workspace = true
anyhow.workspace = true
gc-arena.workspace = true
hashbrown.workspace = true
thiserror.workspace = true

[dev-dependencies]
clap = { version = "4.5", features = ["cargo"] }
cpu-time = "1.0"
peak_alloc = "0.3"
rustyline = "14.0"
