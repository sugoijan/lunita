[workspace]
resolver = "2"
members = [
    "util",
]
default-members = [
    ".",
    "util",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["すごいジャン <me@sugoijan.dev>", "kyren <catherine@kyju.org>"]
license = "MIT"
repository = "https://github.com/sugoijan/lunita"
keywords = ["lua", "vm", "sandbox", "interpreter", "gc"]
categories = ["compilers", "game-development"]

[workspace.dependencies]
# Without `runtime-rng`, which needs `getrandom` (and JS imports on wasm32-unknown-unknown).
ahash = { version = "0.8", default-features = false, features = ["std"] }
anyhow = "1.0"
gc-arena = { version = "0.7", features = ["hashbrown"] }
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }
serde = "1.0"
thiserror = "2.0"

lunita = { path = "./", version = "0.1.0" }

[package]
name = "lunita"
description = "Stackless Lua VM in pure Rust, hardened for untrusted scripts (a fork of piccolo)"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
# Upstream's CI and nix files, of no use to a host.
exclude = [".circleci", ".envrc", "flake.nix", "flake.lock"]

[dependencies]
ahash.workspace = true
anyhow.workspace = true
gc-arena.workspace = true
hashbrown.workspace = true
thiserror.workspace = true

[dev-dependencies]
clap = { version = "4.5", features = ["cargo"] }
cpu-time = "1.0"
peak_alloc = "0.3"
rustyline = "18.0"
